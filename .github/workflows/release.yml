name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      tag:
        description: 'npm dist-tag'
        type: string
        default: latest

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the version commit and tag, and create the release
      id-token: write # Mint the OIDC token npm trusted publishing requires

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelogithub needs the full tag history
      - run: npm install --global corepack@latest
      - run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Build before bumping, so a broken build fails the run while the
        # version commit and tag have not been pushed yet.
        run: pnpm build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version, commit and tag
        # bumpp writes the version to package.json, commits it, tags that
        # commit and pushes both, so the tag can never disagree with the
        # version being published.
        run: pnpm exec bumpp ${{ inputs.version }} --yes

      - name: Publish to npm
        # No NODE_AUTH_TOKEN: npm authenticates through the OIDC token, and
        # provenance is attested automatically by trusted publishing.
        run: npm publish --tag ${{ inputs.tag }}

      - name: Create GitHub release
        run: npx changelogithub ${{ startsWith(inputs.version, 'pre') && '--prerelease' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
